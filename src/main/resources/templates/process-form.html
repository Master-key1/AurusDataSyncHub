<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Aurus Data Sync Hub</title>

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      margin: 0;
      padding: 0;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      background: #fff;
      color: #333;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0px 8px 25px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      color: #2a5298;
      margin-bottom: 25px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
      color: #1e3c72;
    }

    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #ccc;
      padding: 12px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2a5298, #1e3c72);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .msg {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
    }

    .success {
      background: #e0ffe0;
      color: #2e7d32;
    }

    .error {
      background: #ffe0e0;
      color: #c62828;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>🚀 Aurus Data Sync Hub</h1>

  <form th:action="@{/ui/process}" th:object="${processRequest}" method="post">

    <label>CCT Request</label>
    <textarea th:field="*{cctRequest}"></textarea>

    <label>Processor Request</label>
    <textarea th:field="*{processorRequest}"></textarea>

    <label>Processor Response</label>
    <textarea th:field="*{processorResponse}"></textarea>

    <label>CCT Response</label>
    <textarea th:field="*{cctResponse}"></textarea>

    <button type="submit">💾 Save Data</button>

  </form>

  <!-- MESSAGE -->
  <div th:if="${message}" class="msg success">
    <p th:text="${message}"></p>
  </div>

</div>
</body>
</html>
