<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AurusPay | XML Audit Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .badge-match { background-color: #28a745; color: white; }
        .badge-mismatch { background-color: #dc3545; color: white; }
        .badge-skipped { background-color: #6c757d; color: white; }
        .badge-validation { background-color: #fd7e14; color: white; }
        textarea { font-family: 'Courier New', monospace; font-size: 13px; }
    </style>
</head>
<body>

<div class="container-fluid py-4">
    <h2 class="mb-4">Transaction Audit Dashboard</h2>

    <div th:if="${error}" class="alert alert-danger" role="alert">
        <strong>Error:</strong> <span th:text="${error}"></span>
    </div>

    <div class="card p-4">
        <form method="post" action="/xml/compare">
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Approved XML</label>
                    <textarea name="approvedXml" class="form-control" th:text="${approvedXml}" required></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Declined XML</label>
                    <textarea name="declinedXml" class="form-control" th:text="${declinedXml}" required></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3 px-4">Run Reconciliation</button>
        </form>
    </div>

    <div th:if="${matchList != null}">
        <div th:replace="~{:: auditTable(title='Validation Issues', list=${validationList}, colorClass='badge-validation')}"></div>
        <div th:replace="~{:: auditTable(title='Mismatched Items', list=${mismatchList}, colorClass='badge-mismatch')}"></div>
        <div th:replace="~{:: auditTable(title='Data Matches', list=${matchList}, colorClass='badge-match')}"></div>
        <div th:replace="~{:: auditTable(title='Skipped Items', list=${skippedList}, colorClass='badge-skipped')}"></div>
    </div>
</div>

<table th:fragment="auditTable(title, list, colorClass)" class="table table-hover table-bordered bg-white shadow-sm mt-3">
    <thead class="table-dark">
        <tr><th colspan="6" th:text="${title}"></th></tr>
        <tr>
            <th>Field</th>
            <th>Approved</th>
            <th>Declined</th>
            <th>Status</th>
            <th>Match Pattern</th>
            <th>Reason</th>
        </tr>
    </thead>
    <tbody>
        <tr th:if="${#lists.isEmpty(list)}">
            <td colspan="6" class="text-center text-muted">No records found.</td>
        </tr>
        <tr th:each="row : ${list}">
            <td th:text="${row.field}" class="fw-bold"></td>
            <td th:text="${row.aVal}"></td>
            <td th:text="${row.dVal}"></td>
            <td><span th:classappend="'badge ' + ${colorClass}" th:text="${row['value status']}"></span></td>
            <td th:text="${row.matchPattern}"></td>
            <td th:text="${row.Reason}"></td>
        </tr>
    </tbody>
</table>

</body>
</html>
