
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>XML Smart Comparator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background-color: #f4f6f9;
        }

        .header {
            background: #0d6efd;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        textarea {
            min-height: 350px;
            font-family: Consolas, monospace;
        }

        .table-container {
            max-height: 700px;
            overflow-y: auto;
        }

        .summary-card {
            text-align: center;
            font-weight: bold;
        }

        .match {
            background-color: #d4edda;
        }

        .mismatch {
            background-color: #f8d7da;
        }

        .sticky-header th {
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }

    </style>

</head>

<body>

<div class="container-fluid mt-3">

    <div class="header">
        <h2>XML Smart Comparator</h2>
        <p class="mb-0">
            Compare Approved and Declined XML Transactions
        </p>
    </div>

    <form method="post"
          th:action="@{/xml/compare}">

        <div class="row">

            <div class="col-md-6">

                <label class="form-label">
                    <b>Approved XML</b>
                </label>

                <textarea
                        name="approvedXml"
                        class="form-control"
                        placeholder="Paste Approved XML Here"
                        th:text="${approvedXml}">
                </textarea>

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    <b>Declined XML</b>
                </label>

                <textarea
                        name="declinedXml"
                        class="form-control"
                        placeholder="Paste Declined XML Here"
                        th:text="${declinedXml}">
                </textarea>

            </div>

        </div>

        <div class="text-center mt-4">

            <button type="submit"
                    class="btn btn-primary btn-lg">

                Compare Transactions

            </button>

        </div>

    </form>

    <div th:if="${results != null}">

        <div class="row mt-4">

            <div class="col-md-3">

                <div class="card bg-success text-white summary-card">

                    <div class="card-body">

                        Total Fields

                        <h3 th:text="${#lists.size(results)}"></h3>

                    </div>

                </div>

            </div>

        </div>

        <div class="card mt-4">

            <div class="card-header bg-primary text-white">
                <strong>XML Audit Report</strong>
            </div>

            <div class="card-body table-container">

                <table class="table table-bordered table-hover table-striped">

                    <thead class="sticky-header">

                    <tr>

                        <th>Field</th>
                        <th>Approved Value</th>
                        <th>Declined Value</th>
                        <th>Pattern</th>
                        <th>Reason</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="row : ${results}"
                        th:classappend="${row.pattern == 'MATCHED'} ? 'match' : 'mismatch'">

                        <td>
                            <b th:text="${row.field}"></b>
                        </td>

                        <td th:text="${row.approved}"></td>

                        <td th:text="${row.declined}"></td>

                        <td>
                            <span th:text="${row.pattern}"
                                  th:class="${row.pattern == 'MATCHED'} ? 'text-success fw-bold' : 'text-danger fw-bold'">
                            </span>
                        </td>

                        <td th:text="${row.reason}"></td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
