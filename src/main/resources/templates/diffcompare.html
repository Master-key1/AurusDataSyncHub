<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AURUS Comparator</title>

    <style>
        :root {
            --primary: #0056d2;
            --green: #16a34a;
            --bg: #eafaf1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Segoe UI, sans-serif;
            background: var(--bg);
        }

        .container {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 1400px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-box {
            border: 3px solid #000;
            border-radius: 12px;
            padding: 10px;
            background: #fff;
            display: flex;
            flex-direction: column;
            height: 700px;
        }

        .input-box label {
            font-weight: 700;
            margin-bottom: 8px;
            color: #111827;
        }

        textarea {
            flex: 1;
            width: 100%;
            padding: 12px;
            font-family: Consolas, monospace;
            font-size: 14px;
            border: 1px solid #d1fae5;
            border-radius: 10px;
            background: #f8fffb;
            resize: none;
            outline: none;
        }

        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .compare-btn {
            background: var(--green);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .compare-btn:hover {
            opacity: 0.9;
        }

        .result-section {
            margin-top: 20px;
            display: none;
        }

        .result-section h3 {
            margin-bottom: 10px;
        }

        .result-box {
            background: #111827;
            color: #f9fafb;
            border-radius: 10px;
            padding: 15px;
            min-height: 200px;
            overflow: auto;
            white-space: pre-wrap;
            font-family: Consolas, monospace;
        }

        .loading {
            display: none;
            color: var(--primary);
            font-weight: bold;
            margin-top: 10px;
        }

        @media(max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .input-box {
                height: 500px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <form id="compareForm">

            <div class="grid">

                <div class="input-box">
                    <label for="cctRequest">CCT Request</label>
                    <textarea
                            id="cctRequest"
                            name="cctRequest"
                            placeholder="Paste CCT Request JSON/XML here"></textarea>
                </div>

                <div class="input-box">
                    <label for="processorRequest">Processor Request</label>
                    <textarea
                            id="processorRequest"
                            name="processorRequest"
                            placeholder="Paste Processor Request JSON/XML here"></textarea>
                </div>

            </div>

            <div class="action-bar">
                <button type="submit" class="compare-btn">
                    Compare
                </button>
            </div>

        </form>

        <div class="loading" id="loading">
            Comparing...
        </div>

        <div class="result-section" id="resultSection">
            <h3>Comparison Result</h3>
            <pre class="result-box" id="resultBox"></pre>
        </div>

    </div>
</div>
<script>

document.getElementById("compareForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const cctRequest = document.getElementById("cctRequest").value.trim();
    const processorRequest = document.getElementById("processorRequest").value.trim();

    if (!cctRequest || !processorRequest) {
        alert("Please enter both inputs.");
        return;
    }

    document.getElementById("loading").style.display = "block";
    document.getElementById("resultSection").style.display = "none";

    const formData = new URLSearchParams();

    formData.append("cctRequest", cctRequest);
    formData.append("processorRequest", processorRequest);

    fetch("/diffcompare", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: formData
    })
    .then(response => response.json())
    .then(data => {

        document.getElementById("loading").style.display = "none";
        document.getElementById("resultSection").style.display = "block";

        document.getElementById("resultBox").textContent =
            JSON.stringify(data, null, 4);

    })
    .catch(error => {

        document.getElementById("loading").style.display = "none";
        alert("Error while comparing : " + error);

    });

});

</script>

</body>
</html>
